<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretDrop — {{ title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 2rem; width: 100%; max-width: 480px; box-shadow: 0 4px 32px rgba(0,0,0,.4); text-align: center; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
    a { display: inline-block; padding: 0.65rem 1.5rem; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="/">Share a new secret</a>
  </div>
</body>
</html>
