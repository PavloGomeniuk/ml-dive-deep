<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medieval WASM RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050508;
      color: #c8b89a;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #canvas-wrap {
      position: relative;
      border: 2px solid #5a3a15;
      box-shadow: 0 0 30px rgba(90,58,21,0.4), 0 0 60px rgba(0,0,0,0.8);
    }

    #canvas {
      display: block;
      cursor: crosshair;
      background: #0d0d1a;
    }

    /* Fullscreen scaling */
    #canvas:-webkit-full-screen,
    #canvas:fullscreen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    /* Fullscreen button */
    #fullscreen-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      background: rgba(0,0,0,0.5);
      border: 1px solid #5a3a15;
      color: #d4af37;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 0;
      line-height: 1;
    }

    #fullscreen-btn:hover {
      background: rgba(90,58,21,0.4);
      border-color: #d4af37;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      color: #8888aa;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    #error {
      display: none;
      position: absolute;
      inset: 0;
      padding: 2em;
      background: rgba(0,0,0,0.9);
      color: #cc4444;
      font-size: 0.8rem;
      white-space: pre-wrap;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas" width="800" height="500" tabindex="-1"></canvas>
    <button id="fullscreen-btn" aria-label="Toggle fullscreen" title="Toggle fullscreen">&#x26F6;</button>
    <div id="loading">Loading WASM...</div>
    <div id="error"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
