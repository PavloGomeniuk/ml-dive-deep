version: '3.8'

# Runs the game server + both test suites in isolated Docker containers.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.test.yml down --volumes

services:

  # ── Game server ──────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/3000"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ── Signal relay tests (Node + ws, no browser required) ─────────────────────
  relay-tests:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    command: ["node", "relay.test.js"]
    environment:
      - SERVER_URL=ws://server:3000/ws
    depends_on:
      server:
        condition: service_healthy

  # ── Playwright E2E tests (Chromium + fake media) ─────────────────────────────
  e2e-tests:
    build:
      context: .
      dockerfile: test/Dockerfile.test
    command: ["npx", "playwright", "test", "--config", "playwright.config.js", "--reporter=list"]
    environment:
      - SERVER_URL=http://server:3000
    depends_on:
      server:
        condition: service_healthy
    # Playwright needs a user namespace for Chromium sandboxing
    shm_size: '1gb'
    cap_add:
      - SYS_ADMIN
